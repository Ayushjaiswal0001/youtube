name: nexus-node daily

# Nexus Node: technology / AI systems: Technology and AI explainers in 9:16 and 16:9.
# Publishes 20:00 IST = 14:30 UTC.
# Cron is UTC and GitHub may delay scheduled runs, so the video is published through
# `publishAt` rather than relying on the trigger time itself.
#
# Two independent jobs, because the two formats have different costs: a Short renders in about three
# minutes, a long-form episode in about fifty. Sharing one job meant the Short queued behind the long
# render, and one timeout had to cover both. They now run side by side with their own budgets, and either
# can fail without stopping the other.
#
# Uploads stay off unless `upload` is passed, and are private regardless: the reusable workflow checks the
# publishing gate and `UPLOAD_ENABLED` inside the code, not just here.

# A scheduled run cannot pass dispatch inputs, so `upload` and `release: auto` are derived from the event
# name here, and `produce.yml` then consults channels/<slug>.json before it exports credentials. A channel
# whose publishing policy is `manual` renders and skips the upload; only a channel that opted into
# `mode: scheduled` uploads and receives its release time. Nothing uploads because a render succeeded.

# Cron starts two hours before the release time, not at it. A run that starts at the release instant is late
# by definition: the resolver would shift it to `now + 15 min` and the declared release time would never be
# met. Two hours covers the measured long-form render (18 min on a hosted runner, 50 min on a developer
# machine) plus the 15 minute minimum lead, so both jobs finish before the release and schedule it exactly.

on:
  schedule:
    # 17:59 IST, so the release at 20:00 IST can actually be scheduled.
    - cron: "29 12 * * *"
  workflow_dispatch:
    inputs:
      episode:
        description: Which episode to produce
        type: choice
        options: [both, short, long]
        default: both
      upload:
        description: Perform a real (private) upload after QC and the gate pass
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  short:
    if: ${{ inputs.episode == '' || inputs.episode == 'both' || inputs.episode == 'short' }}
    uses: ./.github/workflows/produce.yml
    with:
      channel: nexus-node
      secret_prefix: NEXUS_NODE
      format: shorts
      timeout_minutes: 60
      # Scheduled runs upload; manual runs upload only when asked. Whether that upload is allowed, and
      # whether it carries a release time, is decided by the channel config inside produce.yml.
      upload: ${{ inputs.upload || github.event_name == 'schedule' }}
      release: ${{ github.event_name == 'schedule' && 'auto' || '' }}
    # Only this channel's credentials. The other channels' tokens are not passed here, so
    # they cannot be reached from this run even by a mistake.
    secrets:
      YT_NEXUS_NODE_CLIENT_ID: ${{ secrets.YT_NEXUS_NODE_CLIENT_ID }}
      YT_NEXUS_NODE_CLIENT_SECRET: ${{ secrets.YT_NEXUS_NODE_CLIENT_SECRET }}
      YT_NEXUS_NODE_REFRESH_TOKEN: ${{ secrets.YT_NEXUS_NODE_REFRESH_TOKEN }}

  long:
    if: ${{ inputs.episode == '' || inputs.episode == 'both' || inputs.episode == 'long' }}
    uses: ./.github/workflows/produce.yml
    with:
      channel: nexus-node
      secret_prefix: NEXUS_NODE
      format: long
      # Measured: an 11-beat 16:9 episode took 3,008 s here. 120 minutes leaves room for a slower
      # runner plus TTS, mixing, QC and the gate without ever timing out a render that is progressing.
      timeout_minutes: 120
      # Scheduled runs upload; manual runs upload only when asked. Whether that upload is allowed, and
      # whether it carries a release time, is decided by the channel config inside produce.yml.
      upload: ${{ inputs.upload || github.event_name == 'schedule' }}
      release: ${{ github.event_name == 'schedule' && 'auto' || '' }}
    secrets:
      YT_NEXUS_NODE_CLIENT_ID: ${{ secrets.YT_NEXUS_NODE_CLIENT_ID }}
      YT_NEXUS_NODE_CLIENT_SECRET: ${{ secrets.YT_NEXUS_NODE_CLIENT_SECRET }}
      YT_NEXUS_NODE_REFRESH_TOKEN: ${{ secrets.YT_NEXUS_NODE_REFRESH_TOKEN }}
