name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uploader:
    name: uploader (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile
        run: python -m compileall -q uploader tests

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI smoke test
        run: python -m uploader.cli --help

  factory:
    name: factory (plan + publish gates)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install system libraries (PyCairo + ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config python3-dev ffmpeg

      - name: Install factory dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pyyaml==6.0.2

      - name: Compile factory and studio
        run: python -m compileall -q factory studio

      - name: Plan generation and publish gate tests
        run: python -m pytest tests/factory -q

      - name: CLI smoke test
        run: |
          python -m factory.cli doctor
          python -m factory.cli plans --channel all
          python -m factory.cli plan status --channel all
