name: production (manual)

# The manual interface: pick a channel, a mode and (optionally) a plan. Rendering, validation and
# upload are separate inputs, so "produce a video" and "publish a video" are different decisions.
#
# UPLOAD_ENABLED and SCHEDULED_PUBLISHING_ENABLED stay false unless this run sets `upload`, and even
# then the workflow's publish step is additionally gated on the publishing gate passing.
#
# One job per channel, each passing only its own three secrets. A single job that receives all nine would
# hand every channel's refresh token to a run that can only ever use one; the daily workflows already work
# this way, and a manual upload validation has to be able to do the same thing without a cron being
# enabled first.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel slug
        required: true
        type: choice
        options: [nexus-node, academic-biohacker, natkhat-toons]
      mode:
        description: What to do
        required: true
        type: choice
        options: [render+validate, render, validate]
        default: render+validate
      plan_id:
        description: Plan id (empty = plan the next episode)
        required: false
        type: string
        default: ""
      format:
        description: Format override (empty = the channel's own)
        required: false
        type: choice
        options: ["", shorts, long]
        default: ""
      upload:
        description: Upload after QC and the publishing gate both pass (private, no release time)
        required: false
        type: boolean
        default: false
      release:
        description: >-
          auto sets the channel's release time on the upload (scheduled publication). Needs upload: true and
          a channel whose publishing policy is `scheduled`.
        required: false
        type: choice
        options: ["", auto]
        default: ""

permissions:
  contents: read

concurrency:
  group: production-${{ inputs.channel }}-${{ inputs.format || 'native' }}
  cancel-in-progress: false

jobs:
  nexus-node:
    if: ${{ inputs.channel == 'nexus-node' }}
    uses: ./.github/workflows/produce.yml
    with:
      channel: nexus-node
      secret_prefix: NEXUS_NODE
      mode: ${{ inputs.mode }}
      plan_id: ${{ inputs.plan_id }}
      format: ${{ inputs.format }}
      upload: ${{ inputs.upload }}
      release: ${{ inputs.release }}
      # A long-form episode took 3,008 s measured; 120 minutes is the budget for one, 60 for a Short.
      timeout_minutes: ${{ inputs.format == 'long' && 120 || 60 }}
    secrets:
      YT_NEXUS_NODE_CLIENT_ID: ${{ secrets.YT_NEXUS_NODE_CLIENT_ID }}
      YT_NEXUS_NODE_CLIENT_SECRET: ${{ secrets.YT_NEXUS_NODE_CLIENT_SECRET }}
      YT_NEXUS_NODE_REFRESH_TOKEN: ${{ secrets.YT_NEXUS_NODE_REFRESH_TOKEN }}

  academic-biohacker:
    if: ${{ inputs.channel == 'academic-biohacker' }}
    uses: ./.github/workflows/produce.yml
    with:
      channel: academic-biohacker
      secret_prefix: ACADEMIC_BIOHACKER
      mode: ${{ inputs.mode }}
      plan_id: ${{ inputs.plan_id }}
      format: ${{ inputs.format }}
      upload: ${{ inputs.upload }}
      release: ${{ inputs.release }}
      timeout_minutes: ${{ inputs.format == 'long' && 120 || 60 }}
    secrets:
      YT_ACADEMIC_BIOHACKER_CLIENT_ID: ${{ secrets.YT_ACADEMIC_BIOHACKER_CLIENT_ID }}
      YT_ACADEMIC_BIOHACKER_CLIENT_SECRET: ${{ secrets.YT_ACADEMIC_BIOHACKER_CLIENT_SECRET }}
      YT_ACADEMIC_BIOHACKER_REFRESH_TOKEN: ${{ secrets.YT_ACADEMIC_BIOHACKER_REFRESH_TOKEN }}

  natkhat-toons:
    if: ${{ inputs.channel == 'natkhat-toons' }}
    uses: ./.github/workflows/produce.yml
    with:
      channel: natkhat-toons
      secret_prefix: NATKHAT_TOONS
      mode: ${{ inputs.mode }}
      plan_id: ${{ inputs.plan_id }}
      format: ${{ inputs.format }}
      upload: ${{ inputs.upload }}
      release: ${{ inputs.release }}
      timeout_minutes: ${{ inputs.format == 'long' && 120 || 60 }}
    secrets:
      YT_NATKHAT_TOONS_CLIENT_ID: ${{ secrets.YT_NATKHAT_TOONS_CLIENT_ID }}
      YT_NATKHAT_TOONS_CLIENT_SECRET: ${{ secrets.YT_NATKHAT_TOONS_CLIENT_SECRET }}
      YT_NATKHAT_TOONS_REFRESH_TOKEN: ${{ secrets.YT_NATKHAT_TOONS_REFRESH_TOKEN }}
