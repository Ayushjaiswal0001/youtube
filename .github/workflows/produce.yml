name: produce

# Reusable single-channel production run.
#
# Stage boundaries are explicit and enforced by `if:` conditions, because the expensive mistake in a
# factory like this is publishing something nobody approved:
#
#   PLAN -> RENDER -> QC -> PACKAGE (manifest) -> GATE -> [APPROVAL] -> UPLOAD -> ARTIFACT
#
# Three authorizations, each of which can stop a publication on its own:
#
#   render    - `factory.controls` (a paused channel produces nothing)
#   upload    - `inputs.upload` here, `FACTORY_ALLOW_UPLOAD=1` inside the CLI, and a passing gate
#   schedule  - `inputs.release: auto` AND the channel's `publishing` block in channels/<slug>.json,
#               read by the "Publishing policy" step; only then is `--schedule` passed at all
#
# `upload` defaults to false everywhere; a render-only run cannot reach the upload steps even if a
# later step fails in a surprising way. Real uploads additionally need FACTORY_ALLOW_UPLOAD=1 *and*
# a passing publishing gate, both of which are checked inside the code, not just in YAML.
#
# A scheduled release is not "whatever time the job finished": `factory.publishing` resolves the
# channel's release time from the run's IST date, shifts a late run by a minimum lead instead of
# jumping to tomorrow, and refuses to schedule at all once the grace window has passed.
#
# Required repository secrets for uploads (upload: true):
#   YT_<PREFIX>_CLIENT_ID / YT_<PREFIX>_CLIENT_SECRET / YT_<PREFIX>_REFRESH_TOKEN
#   PREFIX = NEXUS_NODE | ACADEMIC_BIOHACKER | NATKHAT_TOONS
#
# Uploads stay private unless a channel config explicitly allows public, which none do.
#
# NOT YET EXECUTED ON GITHUB ACTIONS as of T49: see CLOUD_DEPLOYMENT.md for the exact blocker and the
# command that runs it once the branch reaches the default branch.

on:
  workflow_call:
    inputs:
      channel:
        description: Channel slug (nexus-node, academic-biohacker, natkhat-toons)
        required: true
        type: string
      secret_prefix:
        description: Secret name fragment (NEXUS_NODE, ACADEMIC_BIOHACKER, NATKHAT_TOONS)
        required: true
        type: string
      upload:
        description: Perform a real (private) upload after QC and the publishing gate pass
        required: false
        type: boolean
        default: false
      release:
        description: >-
          auto sets the channel's release time (scheduled publication) on the upload; empty leaves the
          upload private with no publishAt. A `schedule` event can never supply `upload`, so the daily
          workflows pass release: auto and this file asks the channel's publishing policy whether an
          automatic upload is allowed at all.
        required: false
        type: string
        default: ""
      mode:
        description: "render | validate | render+validate"
        required: false
        type: string
        default: render+validate
      plan_id:
        description: Optional plan id; empty means "plan the next episode"
        required: false
        type: string
        default: ""
      format:
        description: "Optional format override: shorts | long"
        required: false
        type: string
        default: ""
      allow_unpublished:
        description: Natkhat only - plan the next episode even if the previous is unpublished
        required: false
        type: boolean
        default: false
      timeout_minutes:
        # Shorts render in ~3 minutes, long-form in ~50. A single number for both meant the only way to
        # fit long-form was to raise the Short's timeout too, which hides a hung Short behind an hour of
        # nothing. The caller states the budget for the episode it is asking for.
        description: Wall-clock budget for this job, in minutes
        required: false
        type: number
        default: 60

    # Declared explicitly so a caller passes only the three secrets that channel needs. With
    # `secrets: inherit` every repository secret - including the other two channels' refresh tokens -
    # arrived here whether or not this run could ever use it.
    secrets:
      YT_NEXUS_NODE_CLIENT_ID:
        required: false
      YT_NEXUS_NODE_CLIENT_SECRET:
        required: false
      YT_NEXUS_NODE_REFRESH_TOKEN:
        required: false
      YT_ACADEMIC_BIOHACKER_CLIENT_ID:
        required: false
      YT_ACADEMIC_BIOHACKER_CLIENT_SECRET:
        required: false
      YT_ACADEMIC_BIOHACKER_REFRESH_TOKEN:
        required: false
      YT_NATKHAT_TOONS_CLIENT_ID:
        required: false
      YT_NATKHAT_TOONS_CLIENT_SECRET:
        required: false
      YT_NATKHAT_TOONS_REFRESH_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  # One production run per channel *and format*, and never cancel a render in progress: a half-written
  # episode is worse than a queued one. This keeps a horizontal render and a Short independent.
  group: produce-${{ inputs.channel }}-${{ inputs.format || 'native' }}
  cancel-in-progress: false

env:
  CHANNEL: ${{ inputs.channel }}
  PLAN_ID: ${{ inputs.plan_id }}
  FORMAT: ${{ inputs.format }}
  FACTORY_BUILD_DIR: ${{ github.workspace }}/build
  FACTORY_STATE_DIR: ${{ github.workspace }}/pipeline_state
  FACTORY_LOG_DIR: ${{ github.workspace }}/logs
  YT_STATE_ROOT: ${{ github.workspace }}/.state/youtube
  YT_SECRETS_ROOT: ${{ github.workspace }}/.secrets/youtube
  CHROME_PATH: /usr/bin/google-chrome
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"
  # The defaults that make accidental publishing impossible. The upload job overrides the first one
  # only, and only when it has already been gated on the approval input.
  UPLOAD_ENABLED: "false"
  SCHEDULED_PUBLISHING_ENABLED: "false"
  PUBLICATION_APPROVAL_REQUIRED: "true"

jobs:
  produce:
    runs-on: ubuntu-latest
    # Measured on a developer machine: a Short takes 166 s, an 11-beat 16:9 episode takes 3,008 s. The
    # Short keeps 60 minutes of headroom; long-form asks for 120 so a slower runner cannot time out a
    # render that is progressing.
    timeout-minutes: ${{ inputs.timeout_minutes }}
    outputs:
      plan_id: ${{ steps.resolve.outputs.plan_id }}
      qc_ok: ${{ steps.qc.outputs.ok }}
      gate_ok: ${{ steps.gate.outputs.ok }}
      sha256: ${{ steps.package.outputs.sha256 }}
      artifact_dir: ${{ steps.resolve.outputs.artifact_dir }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.2.2

      - name: Verify repository identity
        run: |
          echo "repository: ${GITHUB_REPOSITORY}"
          if [ "${GITHUB_REPOSITORY}" != "Ayushjaiswal0001/youtube" ]; then
            echo "::error::this workflow is authorized only for Ayushjaiswal0001/youtube"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          # Bound mirror and package-lock stalls; the step timeout is the final backstop.
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            -o Acquire::ForceIPv4=true \
            -o DPkg::Lock::Timeout=60 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=20 \
            -o Acquire::https::Timeout=20 \
            -o Acquire::ForceIPv4=true \
            -o DPkg::Lock::Timeout=60 install -y --no-install-recommends \
            ffmpeg libcairo2-dev pkg-config python3-dev fonts-dejavu-core
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install Python dependencies
        timeout-minutes: 10
        run: |
          python -m pip install --timeout 20 --retries 3 --upgrade pip
          python -m pip install --timeout 20 --retries 3 -r requirements.txt

      - name: Restore pipeline state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.2.0
        with:
          path: |
            pipeline_state
            .state/youtube
          # The format is part of the key because two jobs of the same run (Short and long-form) share
          # `github.run_id`: without it the second save would overwrite the first job's state.
          key: state-${{ inputs.channel }}-${{ inputs.format || 'native' }}-${{ github.run_id }}
          restore-keys: |
            state-${{ inputs.channel }}-${{ inputs.format || 'native' }}-
            state-${{ inputs.channel }}-

      - name: Preflight
        run: |
          set -o pipefail
          python -m factory.cli preflight --channel "$CHANNEL" --json | tee preflight.json
          python - <<'PY'
          import json, sys
          report = json.load(open("preflight.json", encoding="utf-8"))
          if not report["ok"]:
              print("::error::preflight failed: " + ", ".join(report["failed"]))
              sys.exit(1)
          print("preflight ok:", len(report["checks"]), "checks")
          PY

      - name: Doctor
        run: |
          set -o pipefail
          python -m factory.cli doctor --json | tee doctor.json

      - name: Research (discovery record)
        # Non-blocking by design: a dead feed is recorded in the report and the run continues with the
        # authored topic bank. Research that can stop production is research nobody leaves enabled.
        continue-on-error: true
        run: |
          python -m factory.cli research --channel "$CHANNEL" --limit 10 --json \
            > research.json 2> research.log || echo "::warning::research run failed, see research.log"
          python -c "import json,pathlib; d=json.loads(pathlib.Path('research.json').read_text(encoding='utf-8')); i=d[0] if isinstance(d,list) else d; print(f\"::notice::research {i['candidates']} candidate(s) from {len(i['sources'])} source(s)\")" \
            || echo "::notice::research produced no report"

      - name: Content availability
        # A content gap is not a production failure. `plan available` answers without producing anything and
        # separates "the bank is exhausted" (warning, skip) from "this run is blocked" (hard failure, exit 2).
        id: content
        env:
          PLAN_ID: ${{ inputs.plan_id }}
          FORMAT: ${{ inputs.format }}
          ALLOW_UNPUBLISHED: ${{ inputs.allow_unpublished }}
        run: |
          if [ -n "$PLAN_ID" ]; then
            echo "available=1" >> "$GITHUB_OUTPUT"
            echo "kind=explicit" >> "$GITHUB_OUTPUT"
            echo "reason=an explicit plan id was requested" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ARGS=(--channel "$CHANNEL")
          if [ -n "$FORMAT" ]; then ARGS+=(--format "$FORMAT"); fi
          if [ "$ALLOW_UNPUBLISHED" = "true" ]; then ARGS+=(--allow-unpublished); fi
          python -m factory.cli plan available "${ARGS[@]}" --json > available.json
          python tools/content_outputs.py available.json > content.txt
          cat content.txt >> "$GITHUB_OUTPUT"
          cat available.json
          # A content gap is announced, not failed. An exhausted bank means the day has no episode; a blocked
          # run is a fault and `plan available` has already exited non-zero, failing the step above.
          if grep -q '^available=0' content.txt; then
            echo "::warning::no content available: $(grep '^reason=' content.txt | cut -d= -f2-)"
          else
            echo "plan available: $(grep '^plan_id=' content.txt | cut -d= -f2-)"
          fi

      - name: Resolve the plan
        if: ${{ steps.content.outputs.available == '1' }}
        id: resolve
        env:
          ALLOW_UNPUBLISHED: ${{ inputs.allow_unpublished }}
        run: |
          if [ -n "$PLAN_ID" ]; then
            # `plan_id` is a manual-dispatch string. Normalize it before writing to GITHUB_OUTPUT so
            # newlines cannot forge outputs and shell metacharacters cannot reach later run steps.
            RESOLVED=$(python - <<'PY'
          import os
          from factory.util import slugify
          print(slugify(os.environ["PLAN_ID"]))
          PY
          )
            echo "using requested plan: $RESOLVED"
          else
            EXTRA=()
            if [ "$ALLOW_UNPUBLISHED" = "true" ]; then EXTRA+=(--allow-unpublished); fi
            # An empty FORMAT means "the channel's native format", which is what the Short job wants.
            if [ -n "$FORMAT" ]; then EXTRA+=(--format "$FORMAT"); fi
            python -m factory.cli plan new --channel "$CHANNEL" --json "${EXTRA[@]}" > plan.json
            RESOLVED=$(python - <<'PY'
          import json
          data = json.load(open("plan.json", encoding="utf-8"))
          item = data[0] if isinstance(data, list) else data
          print(item["plan_id"])
          PY
          )
          fi
          ARTIFACT_DIR="${FACTORY_BUILD_DIR}/${CHANNEL}"
          echo "plan_id=${RESOLVED}" >> "$GITHUB_OUTPUT"
          echo "artifact_dir=${ARTIFACT_DIR}" >> "$GITHUB_OUTPUT"

      - name: Resume or render
        if: ${{ inputs.mode != 'validate' && steps.content.outputs.available == '1' }}
        env:
          RESOLVED_PLAN: ${{ steps.resolve.outputs.plan_id }}
        run: |
          ARGS=(--channel "$CHANNEL" --plan-id "$RESOLVED_PLAN")
          if [ -n "$FORMAT" ]; then ARGS+=(--format "$FORMAT"); fi
          # `resume` re-renders only missing or stale scenes and never touches a verified artifact;
          # `--force` is deliberately not used here.
          # `set -o pipefail` is not optional: `cmd | tee file` reports tee's status, so a failing
          # `resume` looked like a passing step in run 45073494545 and the next step failed instead.
          set -o pipefail
          python -m factory.cli resume "${ARGS[@]}" --json | tee resume.json

      - name: Quality assurance
        if: ${{ steps.content.outputs.available == '1' }}
        id: qc
        env:
          RESOLVED_PLAN: ${{ steps.resolve.outputs.plan_id }}
        run: |
          ARGS=(--channel "$CHANNEL" --plan-id "$RESOLVED_PLAN")
          if [ -n "$FORMAT" ]; then ARGS+=(--format "$FORMAT"); fi
          # A plan id that is not in the repository is an error now, not an empty report.
          set -o pipefail
          python -m factory.cli validate "${ARGS[@]}" --json | tee qc-step.json
          python - <<'PY'
          import json, os, sys
          data = json.load(open("qc-step.json", encoding="utf-8"))
          items = data if isinstance(data, list) else [data]
          item = items[0] if items else {}
          if not item:
              # An empty report means nothing was rendered, which is a different failure from "QC failed".
              # Run 45071096194 died here with `IndexError: list index out of range`, three steps away from
              # the real cause (a plan id that is not in the repository).
              plan = os.environ.get("PLAN_ID") or "(auto)"
              print(f"::error::nothing was rendered for plan {plan!r} on channel "
                    f"{os.environ.get('CHANNEL')!r}; is that plan in content/?")
              sys.exit(1)
          ok = bool(item.get("qc_ok"))
          print(f"::{'notice' if ok else 'error'}::QC {'passed' if ok else 'failed'} for {item.get('plan_id')}")
          open("qc_ok.txt", "w").write("1" if ok else "0")
          PY
          echo "ok=$(cat qc_ok.txt)" >> "$GITHUB_OUTPUT"
          test "$(cat qc_ok.txt)" = "1"

      - name: Rebuild manifest after QC
        if: ${{ steps.content.outputs.available == '1' }}
        # The render writes a manifest, then this workflow's own QC step rewrites qc.json. The first cloud run
        # failed here: the manifest still hashed the pre-QC report, same size, different bytes. The manifest is
        # now rebuilt from the bytes that are final, and the gate verifies against those.
        env:
          RESOLVED_PLAN: ${{ steps.resolve.outputs.plan_id }}
        run: |
          ARGS=(--channel "$CHANNEL" --plan-id "$RESOLVED_PLAN")
          if [ -n "$FORMAT" ]; then ARGS+=(--format "$FORMAT"); fi
          set -o pipefail
          python -m factory.cli manifest "${ARGS[@]}" --json | tee manifest-step.json

      - name: Publishing gate
        if: ${{ steps.content.outputs.available == '1' }}
        id: gate
        env:
          RESOLVED_PLAN: ${{ steps.resolve.outputs.plan_id }}
        run: |
          ARGS=(--channel "$CHANNEL" --plan-id "$RESOLVED_PLAN")
          set -o pipefail
          python -m factory.cli gate "${ARGS[@]}" --json | tee gate.json
          python - <<'PY'
          import json
          data = json.load(open("gate.json", encoding="utf-8"))
          item = data[0] if isinstance(data, list) and data else (data or {})
          ok = bool(item.get("ok"))
          print(f"::{'notice' if ok else 'error'}::publishing gate "
                f"{'PASS' if ok else 'BLOCKED: ' + ', '.join(item.get('blockers') or [])}")
          open("gate_ok.txt", "w").write("1" if ok else "0")
          PY
          echo "ok=$(cat gate_ok.txt)" >> "$GITHUB_OUTPUT"
          test "$(cat gate_ok.txt)" = "1"

      - name: Package manifest
        if: ${{ steps.content.outputs.available == '1' }}
        id: package
        run: |
          python - <<'PY'
          import json, os, pathlib
          channel = os.environ["CHANNEL"]
          plan_id = os.environ.get("RESOLVED_PLAN") or ""
          manifests = sorted(pathlib.Path("build", channel).glob("*/manifest.json"))
          if not manifests:
              manifests = sorted(pathlib.Path("build").glob(f"**/{channel}*/manifest.json"))
          if not manifests:
              print("::error::no manifest was produced by the render")
              raise SystemExit(1)
          manifest = json.loads(manifests[-1].read_text(encoding="utf-8"))
          video = next((a for a in manifest["artifacts"] if a["name"] == "video"), None)
          if not video or not video.get("complete"):
              print("::error::the video artifact is missing or incomplete")
              raise SystemExit(1)
          print(f"::notice::artifact {video['name']} {video['bytes']} B sha256 {video['sha256']}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as handle:
              handle.write(f"sha256={video['sha256']}\n")
              handle.write(f"manifest={manifests[-1]}\n")
          PY
        env:
          RESOLVED_PLAN: ${{ steps.resolve.outputs.plan_id }}

      - name: Emergency stop check
        # A repository variable (FACTORY_PAUSED / FACTORY_PAUSED_CHANNELS) stops the run before any work,
        # so stopping production never depends on someone being at a keyboard.
        env:
          FACTORY_PAUSED: ${{ vars.FACTORY_PAUSED }}
          FACTORY_PAUSED_CHANNELS: ${{ vars.FACTORY_PAUSED_CHANNELS }}
        run: |
          python -c "import os,sys; from factory.controls import pause_state; s = pause_state(os.environ['CHANNEL']); print(s.reason) if s.paused else None; sys.exit(1 if s.paused else 0)"

      - name: Validate channel slug
        # The slug becomes a directory name and a command argument, so it is checked to be one of the
        # three known channels before any step uses it.
        run: |
          case "$CHANNEL" in
            nexus-node|academic-biohacker|natkhat-toons) ;;
            *) echo "::error::unknown channel '$CHANNEL'"; exit 1 ;;
          esac

      - name: Publishing policy (per channel)
        # Three separate authorizations: rendering, uploading, scheduling. This step answers the third one
        # from the channel config, so a scheduled run never uploads merely because it rendered, and a
        # channel that has not opted in stays manual. The gate below distinguishes the two kinds of upload:
        # `release: auto` (a scheduled publication, which needs the channel's consent) from an explicit
        # `upload: true` with no release (a human asking for a private upload, which does not).
        id: policy
        run: |
          python -m factory.cli publishing --channel "$CHANNEL" --json > publishing.json
          python tools/publishing_outputs.py publishing.json >> "$GITHUB_OUTPUT"
          cat publishing.json

      - name: Export channel credentials
        id: creds
        if: ${{ inputs.upload && steps.content.outputs.available == '1' && (inputs.release != 'auto' || steps.policy.outputs.ready == '1') }}
        env:
          # Passed through the environment: interpolating a dispatch input straight into a shell
          # command is how `$(...)` typed into an input becomes a command on the runner.
          SECRET_PREFIX: ${{ inputs.secret_prefix }}
          CLIENT_ID: ${{ secrets[format('YT_{0}_CLIENT_ID', inputs.secret_prefix)] }}
          CLIENT_SECRET: ${{ secrets[format('YT_{0}_CLIENT_SECRET', inputs.secret_prefix)] }}
          REFRESH_TOKEN: ${{ secrets[format('YT_{0}_REFRESH_TOKEN', inputs.secret_prefix)] }}
        run: |
          PREFIX=$(printf '%s' "$SECRET_PREFIX" | tr 'a-z' 'A-Z')
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$REFRESH_TOKEN" ]; then
            echo "::warning::YT_${PREFIX}_* secrets are missing; upload will be skipped"
            echo "ready=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Never echoed. `::add-mask::` is belt-and-braces in case a future step prints an env dump.
          echo "::add-mask::${CLIENT_ID}"
          echo "::add-mask::${CLIENT_SECRET}"
          echo "::add-mask::${REFRESH_TOKEN}"
          {
            echo "YT_${PREFIX}_CLIENT_ID=${CLIENT_ID}"
            echo "YT_${PREFIX}_CLIENT_SECRET=${CLIENT_SECRET}"
            echo "YT_${PREFIX}_REFRESH_TOKEN=${REFRESH_TOKEN}"
          } >> "$GITHUB_ENV"
          echo "ready=1" >> "$GITHUB_OUTPUT"

      - name: Verify channel identity before upload
        if: ${{ inputs.upload && steps.content.outputs.available == '1' && (inputs.release != 'auto' || steps.policy.outputs.ready == '1') && steps.creds.outputs.ready == '1' }}
        run: python -m uploader.cli verify --channel "$CHANNEL"

      - name: Upload (private, gated)
        if: ${{ inputs.upload && steps.content.outputs.available == '1' && (inputs.release != 'auto' || steps.policy.outputs.ready == '1') && steps.creds.outputs.ready == '1' && steps.gate.outputs.ok == '1' }}
        env:
          FACTORY_ALLOW_UPLOAD: "1"
          UPLOAD_ENABLED: "true"
          # Only a run that asked for the channel's release time may schedule one, and only here.
          FACTORY_ALLOW_SCHEDULE: ${{ inputs.release == 'auto' && '1' || '0' }}
          RELEASE_MODE: ${{ inputs.release }}
          RESOLVED_PLAN: ${{ steps.resolve.outputs.plan_id }}
        run: |
          ARGS=(--channel "$CHANNEL" --plan-id "$RESOLVED_PLAN"
                --execute --confirm-channel "$CHANNEL" --json)
          if [ "$RELEASE_MODE" = "auto" ]; then
            ARGS+=(--schedule)
          fi
          python -m factory.cli publish "${ARGS[@]}" | tee publish.json

      - name: Notify on failure
        # Provider-independent: silently a no-op unless FACTORY_NOTIFY_WEBHOOK is configured, and the
        # summary below is written either way. The message names the channel, the format, the release mode
        # and the run URL, because "production failed" without a run id costs the reader a search.
        if: failure()
        continue-on-error: true
        env:
          FACTORY_NOTIFY_WEBHOOK: ${{ secrets.FACTORY_NOTIFY_WEBHOOK }}
          FORMAT_LABEL: ${{ inputs.format || 'native' }}
          UPLOAD_REQUESTED: ${{ inputs.upload }}
          RELEASE_LABEL: ${{ inputs.release || 'none' }}
          RELEASE_SCHEDULED: ${{ steps.policy.outputs.next_release }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          python -m factory.cli notify \
            --subject "production failed: $CHANNEL ($FORMAT_LABEL)" \
            --message "run $GITHUB_RUN_ID on $GITHUB_REF_NAME failed; upload=$UPLOAD_REQUESTED release=$RELEASE_LABEL; $RUN_URL" || true
          {
            echo "## production failure"
            echo ""
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| channel | \`$CHANNEL\` |"
            echo "| format | \`$FORMAT_LABEL\` |"
            echo "| upload requested | $UPLOAD_REQUESTED |"
            echo "| release mode | $RELEASE_LABEL |"
            echo "| release scheduled | $RELEASE_SCHEDULED |"
            echo "| run | $RUN_URL |"
            echo ""
            echo "A refusal to schedule is a failure on purpose: a release window that was missed must be seen,"
            echo "not silently skipped."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Operational summary
        if: always()
        env:
          RESOLVED_PLAN: ${{ steps.resolve.outputs.plan_id }}
          CONTENT_STATUS: ${{ steps.content.outputs.available == '1' && 'available' || 'none (content gap)' }}
          QC_STATUS: ${{ steps.qc.outputs.ok }}
          GATE_STATUS: ${{ steps.gate.outputs.ok }}
          VIDEO_SHA256: ${{ steps.package.outputs.sha256 }}
          POLICY_MODE: ${{ steps.policy.outputs.mode }}
          POLICY_READY: ${{ steps.policy.outputs.ready }}
          RELEASE_LABEL: ${{ inputs.release || '(private, no release time)' }}
          RELEASE_SCHEDULED: ${{ steps.policy.outputs.next_release }}
          RELEASE_REASON: ${{ steps.policy.outputs.release_reason }}
          PENDING_RELEASE: ${{ steps.policy.outputs.pending_release || 'none' }}
          UPLOAD_PERFORMED: ${{ steps.creds.outputs.ready == '1' && inputs.upload }}
          UPLOAD_REQUESTED: ${{ inputs.upload }}
        run: |
          python -m factory.cli ops --channel "$CHANNEL" | tee ops.txt || true
          {
            echo "## ${CHANNEL} production"
            echo ""
            echo "| item | value |"
            echo "| --- | --- |"
            echo "| content | $CONTENT_STATUS |"
            echo "| plan | \`$RESOLVED_PLAN\` |"
            echo "| QC | $QC_STATUS |"
            echo "| publishing gate | $GATE_STATUS |"
            echo "| video sha256 | \`$VIDEO_SHA256\` |"
            echo "| upload requested | $UPLOAD_REQUESTED |"
            echo "| publishing policy | $POLICY_MODE (ready $POLICY_READY) |"
            echo "| release mode | $RELEASE_LABEL |"
            echo "| release scheduled | $RELEASE_SCHEDULED ($RELEASE_REASON) |"
            echo "| another release pending | $PENDING_RELEASE |"
            echo "| upload performed | $UPLOAD_PERFORMED |"
            echo ""
            echo '```'
            cat ops.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.4.3
        with:
          name: ${{ inputs.channel }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            plan.json
            resume.json
            qc-step.json
            gate.json
            publish.json
            preflight.json
            doctor.json
            ops.txt
            build/**/qc.json
            build/**/captions.srt
            build/**/thumbnail.jpg
            build/**/manifest.json
            build/**/framing.json
            build/**/video.mp4
            # Everything the manifest hashes has to be downloadable, or "verified" can only mean
            # "the runner said so". The gate reads story.json, script.json, shot_plan.json and
            # continuity.json; none of them were in this list.
            build/**/story.json
            build/**/script.json
            build/**/timeline.json
            build/**/shot_plan.json
            build/**/continuity.json
            build/**/publish_gate.json
            build/**/runs.jsonl
            pipeline_state/**/runs.jsonl
            pipeline_state/jobs/**/job.json

      - name: Save pipeline state
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.2.0
        with:
          path: |
            pipeline_state
            .state/youtube
          key: state-${{ inputs.channel }}-${{ inputs.format || 'native' }}-${{ github.run_id }}
