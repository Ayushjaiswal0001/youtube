name: academic-biohacker daily

# Academic Biohacker: evidence-first health science. Publishes 12:00 IST = 06:30 UTC.
# Not yet executed on Actions - see TASKS.md T12.

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      upload:
        description: Perform a real (private) upload after QC passes
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  produce:
    uses: ./.github/workflows/produce.yml
    with:
      channel: academic-biohacker
      secret_prefix: ACADEMIC_BIOHACKER
      upload: ${{ inputs.upload || false }}
    # Only this channel's credentials. The other channels' tokens are not passed here, so
    # they cannot be reached from this run even by a mistake.
    secrets:
      YT_ACADEMIC_BIOHACKER_CLIENT_ID: ${{ secrets.YT_ACADEMIC_BIOHACKER_CLIENT_ID }}
      YT_ACADEMIC_BIOHACKER_CLIENT_SECRET: ${{ secrets.YT_ACADEMIC_BIOHACKER_CLIENT_SECRET }}
      YT_ACADEMIC_BIOHACKER_REFRESH_TOKEN: ${{ secrets.YT_ACADEMIC_BIOHACKER_REFRESH_TOKEN }}
